name: Deploy to GitHub Pages

on:
  # Auto-deploy anytime code lands on main
  push:
    branches: [ "main" ]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Required for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # SAFETY CHECK: fail the build if any HTML tries to load a .ts file directly
      # (This catches accidental merges that reference src/entry/landing.ts, etc.)
      - name: Guardrail – no .ts in <script> src
        run: |
          set -e
          # Scan common locations including the repo root
          grep -RIn --include="*.html" -E '<script[^>]*type=["'\'']module["'\''][^>]*src=["'\''][^"'\''>]+\.ts["'\'']' . && \
            { echo "::error::Found a <script type='module' src='... .ts'> in HTML. Use built JS instead."; exit 1; } || true

      - name: Build site
        # If your Vite config needs a base for GH Pages, make sure it's set there (likely already done)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
