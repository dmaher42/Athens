name: gh-pages

# Set top-level permissions for OIDC authentication
permissions:
  id-token: write
  contents: read
  pages: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: GH_PAGES=1 npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment

# Notes:
# - We set GH_PAGES=1 so vite.config uses base '/athens/'.
# - Only 'dist' is published — dev HTML that imports node_modules is NOT deployed.
